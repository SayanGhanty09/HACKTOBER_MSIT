name: anebilin-health
region: nyc

static_sites:
  - name: dashboard
    source_dir: dashboard
    build_command: npm run build
    output_dir: dist
    routes:
      - path: /
    envs:
      - key: VITE_SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${VITE_SUPABASE_URL}
      - key: VITE_SUPABASE_ANON_KEY
        scope: RUN_AND_BUILD_TIME
        value: ${VITE_SUPABASE_ANON_KEY}
      - key: VITE_ML_BASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${ml-server.PUBLIC_URL}

services:
  - name: ml-server
    source_dir: dashboard/ml_server
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8000
    run_command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    health_check:
      http_path: /health
    envs:
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: "*"
