[env:esp32-s3-devkitc-1]
; pioarduino fork — ships Arduino core 3.x / ESP-IDF 5.x, required by
; ledcAttach() and NimBLE-Arduino 2.x. The official "espressif32" platform
; still ships Arduino core 2.0.17 and will not compile this firmware.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I include
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    h2zero/NimBLE-Arduino @ ^2.0.0
